name: Portable quality package
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  package-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Run portable regression suite
        run: python3 -m unittest discover -s tests -v
      - name: Compile Python modules
        run: python3 -m compileall -q workflow configure.py setup_quality.py
